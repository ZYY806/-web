{% extends "base.html" %}
{% block title %}登录 · 九达天衢{% endblock %}
{% block content %}

<section>
    <div class="wrap">
        <div class="form-box">
            <h2>登录</h2>
            <form method="post" action="{{ url_for('login') }}">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required>
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
                <button class="btn btn-primary" type="submit">登录</button>
            </form>
            <p class="text-center" style="margin-top:14px;font-size:14px;color:#666;">
                还没有账号？<a href="{{ url_for('register') }}">去注册</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
