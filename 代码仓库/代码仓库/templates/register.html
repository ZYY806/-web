{% extends "base.html" %}
{% block title %}注册 · 九达天衢{% endblock %}
{% block content %}

<section>
    <div class="wrap">
        <div class="form-box">
            <h2>注册账号</h2>
            <form method="post" action="{{ url_for('register') }}">
                <label>用户名</label>
                <input type="text" name="username" placeholder="用于登录，不可重复" required>
                <label>密码</label>
                <input type="password" name="password" placeholder="请设置密码" required>
                <label>昵称（可选）</label>
                <input type="text" name="nickname" placeholder="不填则默认用用户名">
                <button class="btn btn-primary" type="submit">注册</button>
            </form>
            <p class="text-center" style="margin-top:14px;font-size:14px;color:#666;">
                已有账号？<a href="{{ url_for('login') }}">去登录</a>
            </p>
        </div>
    </div>
</section>

{% endblock %}
